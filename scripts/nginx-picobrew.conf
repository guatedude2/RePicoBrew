# RePicoBrew nginx configuration
# Reverse proxy for Remix app on port 8080

upstream repicobrew_app {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    
    # Match both picobrew.com and the Pi's IP
    server_name picobrew.com www.picobrew.com 192.168.72.1 localhost _;

    # Logging
    access_log /var/log/nginx/picobrew-access.log;
    error_log /var/log/nginx/picobrew-error.log;

    # Increase timeouts for long-running brew sessions
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # SSE (Server-Sent Events) support
    proxy_buffering off;
    proxy_cache off;

    # Friendly page while the app is (re)starting, instead of nginx's bare 502/503/504. The original
    # status code is kept on purpose so probes (e.g. the Settings -> System restart overlay) can still
    # tell the app is down. UI only: set inside `location /` so the PicoBrew devices' /API/ routes
    # below keep plain error responses. The file is installed to /var/www/repicobrew by
    # scripts/deploy-to-pi.sh / pi-image/chroot-provision.sh.
    location = /repicobrew-starting.html {
        internal;
        root /var/www/repicobrew;
        add_header Cache-Control "no-store" always;
    }

    # Root location - serve UI
    location / {
        error_page 502 503 504 /repicobrew-starting.html;
        proxy_pass http://repicobrew_app;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Pico API endpoints - case sensitive /API/pico/*
    # Firmware expects uppercase /API/
    location ~ ^/API/pico/ {
        proxy_pass http://repicobrew_app;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE events endpoint
    location /api/events {
        proxy_pass http://repicobrew_app;
        proxy_http_version 1.1;
        
        # SSE specific headers
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header X-Accel-Buffering 'no';
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep connection alive
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        # Long timeout for SSE
        proxy_read_timeout 3600s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://repicobrew_app;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
